<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie AI - Food Recommendations</title>
    <meta name="description" content="Discover tailored recipes based on your dietary preferences and calorie limits.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="glass-panel">
            <h1>Foodie AI</h1>
            <p>Your personalized culinary guide.</p>
        </header>

        <section class="filter-section glass-panel">
            <form id="filter-form">
                <div class="form-group">
                    <label for="cuisine">Preferred Cuisine</label>
                    <select id="cuisine" name="cuisine">
                        <option value="Any">Any Cuisine</option>
                        <option value="Indian">Indian</option>
                        <option value="Italian">Italian</option>
                        <option value="Chinese">Chinese</option>
                        <option value="American">American</option>
                        <option value="Global">Global</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dietary Restrictions</label>
                    <div class="checkbox-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="vegetarian" id="vegetarian">
                            <span class="checkmark"></span>
                            Vegetarian
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="vegan" id="vegan">
                            <span class="checkmark"></span>
                            Vegan
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="gluten_free" id="gluten_free">
                            <span class="checkmark"></span>
                            Gluten-Free
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="max_calories">Max Calories: <span id="calorie-value">1000</span> kcal</label>
                    <input type="range" id="max_calories" name="max_calories" min="100" max="2000" step="50" value="1000">
                </div>

                <button type="submit" class="btn-primary">
                    <span>Find Meals</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </section>

        <section id="results-section" class="results-grid">
            <!-- Results will be injected here via JS -->
            <div class="placeholder-state glass-panel">
                <p>Select your preferences and hit "Find Meals" to discover recipes.</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <div style="position: fixed; bottom: 10px; right: 10px; font-size: 12px; color: var(--text-muted); opacity: 0.7; pointer-events: none;">&copy; ShivamCodes</div>
</body>
</html>
